<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Swaylume for macOS</title>
  <desc id="desc">A vivid live wallpaper running beneath macOS desktop icons.</desc>
  <defs>
    <!-- 印刷网点。整张图铺一层，黑底才不像一块死色 -->
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1" fill="#F5F1E7" fill-opacity=".085"/>
    </pattern>
    <!-- 速度线。从右上角发散，是这套视觉语言的签名 -->
    <radialGradient id="rayfade" cx="50%" cy="50%" r="50%">
      <stop offset=".2" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="raymask">
      <rect width="1200" height="630" fill="#000"/>
      <circle cx="1010" cy="70" r="620" fill="url(#rayfade)"/>
    </mask>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1B4E6B"/><stop offset=".45" stop-color="#2FA88F"/><stop offset="1" stop-color="#0B1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="72%">
      <stop stop-color="#7CE0F5" stop-opacity=".85"/><stop offset="1" stop-color="#7CE0F5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenclip"><rect x="712" y="150" width="404" height="256"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- 速度线 -->
  <g mask="url(#raymask)" fill="#E60012" opacity=".5">
    <g transform="translate(1010 70)">
      <g id="rays">
        <path d="M0 0 700 -34 700 34Z" transform="rotate(96)"/>
        <path d="M0 0 700 -22 700 22Z" transform="rotate(112)"/>
        <path d="M0 0 700 -30 700 30Z" transform="rotate(128)"/>
        <path d="M0 0 700 -16 700 16Z" transform="rotate(142)"/>
        <path d="M0 0 700 -26 700 26Z" transform="rotate(156)"/>
        <path d="M0 0 700 -18 700 18Z" transform="rotate(170)"/>
        <path d="M0 0 700 -30 700 30Z" transform="rotate(184)"/>
        <path d="M0 0 700 -20 700 20Z" transform="rotate(198)"/>
      </g>
    </g>
  </g>

  <!-- 屏幕：黑框 + 红位移影。壁纸是唯一允许出现渐变的地方 -->
  <g transform="rotate(-2 914 278)">
    <rect x="721" y="159" width="404" height="256" fill="#E60012"/>
    <rect x="708" y="146" width="412" height="264" fill="#0D0D0F"/>
    <g clip-path="url(#screenclip)">
      <rect x="712" y="150" width="404" height="256" fill="url(#wall)"/>
      <rect x="712" y="150" width="404" height="256" fill="url(#glow)"/>
      <path d="M712 356c78-96 132 22 222-64s122-42 182-96v170H712Z" fill="#0B1730" opacity=".55"/>
      <!-- 菜单栏 -->
      <rect x="712" y="150" width="404" height="22" fill="#0A0A0B" fill-opacity=".72"/>
      <text x="724" y="165" fill="#EFEBE1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="11" font-weight="700">访达</text>
      <text x="1108" y="165" text-anchor="end" fill="#EFEBE1" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10">22:14</text>
      <!-- 桌面图标：壁纸从它们底下穿过去 -->
      <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="10" fill="#fff" text-anchor="middle">
        <g transform="translate(730 190)"><path d="M0 6 7 1h13l4 5h16v22H0Z" fill="#65B4F7"/><text x="20" y="42">项目</text></g>
        <g transform="translate(732 258)"><path d="M2 0h21l10 10v29H2Z" fill="#F3F0FB"/><text x="17" y="52">说明.txt</text></g>
      </g>
      <!-- app 窗口 -->
      <g transform="translate(944 268)">
        <rect width="158" height="104" fill="#F3EEE0" stroke="#0D0D0F" stroke-width="2"/>
        <rect width="158" height="22" fill="#E6DFCB" stroke="#0D0D0F" stroke-width="2"/>
        <circle cx="14" cy="11" r="4" fill="#FF5F57"/><circle cx="27" cy="11" r="4" fill="#FEBC2E"/><circle cx="40" cy="11" r="4" fill="#28C840"/>
        <text x="56" y="15" fill="#14120E" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700">Swaylume</text>
        <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9" fill="#5B554A">
          <text x="12" y="44">渲染器</text><text x="146" y="44" text-anchor="end" fill="#14120E">WebGL</text>
          <text x="12" y="88">帧率上限</text><text x="146" y="88" text-anchor="end" fill="#14120E">60 FPS</text>
        </g>
        <rect x="12" y="56" width="134" height="7" fill="#E6DFCB" stroke="#C8BFA6"/>
        <rect x="12" y="56" width="96" height="7" fill="#E60012"/>
      </g>
    </g>
  </g>

  <!-- 眉题 -->
  <g transform="translate(78 92) skewX(-12)">
    <rect width="286" height="40" fill="#E60012"/>
  </g>
  <text x="102" y="119" fill="#fff" font-family="Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif" font-size="24" letter-spacing="4">SWAYLUME / macOS</text>

  <!-- 主标题：白字压红影 -->
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Hiragino Sans',sans-serif" font-size="92" font-weight="900" letter-spacing="-4">
    <text x="82" y="228" fill="#E60012">让桌面</text>
    <text x="78" y="224" fill="#F5F1E7">让桌面</text>
    <text x="82" y="326" fill="#E60012">活过来。</text>
    <text x="78" y="322" fill="#F5F1E7">活过来。</text>
  </g>

  <!-- 红斜杠 -->
  <g transform="translate(78 352) skewX(-24)"><rect width="112" height="9" fill="#E60012"/></g>

  <text x="78" y="404" fill="#ADA79B" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23">视频 · WebGL · 分层视差 · 原生省电</text>

  <!-- 纸质印章 -->
  <g transform="translate(78 442) rotate(-1.4)">
    <rect width="228" height="46" fill="#0D0D0F"/>
    <rect x="-6" y="-6" width="228" height="46" fill="#F3EEE0" stroke="#0D0D0F" stroke-width="2"/>
    <text x="16" y="22" fill="#14120E" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" font-weight="800">桌面图标之下</text>
  </g>
  <g transform="translate(326 442) rotate(1.2)">
    <rect width="212" height="46" fill="none" stroke="#E60012" stroke-width="2"/>
    <text x="16" y="22" fill="#E60012" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" font-weight="800">本地优先 · 不上传</text>
  </g>

  <!-- 底部飘带 -->
  <g transform="rotate(-1.4 600 596)">
    <rect x="-40" y="566" width="1280" height="46" fill="#E60012"/>
    <rect x="-40" y="563" width="1280" height="3" fill="#0D0D0F"/>
    <rect x="-40" y="612" width="1280" height="3" fill="#0D0D0F"/>
    <text x="40" y="597" fill="#0D0D0F" font-family="Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif" font-size="22" letter-spacing="6">SWAYLUME ◆ MACOS LIVE WALLPAPER ◆ 動く壁紙 ◆ SWAYLUME ◆ MACOS LIVE WALLPAPER ◆</text>
  </g>
</svg>
